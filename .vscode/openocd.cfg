# OpenOCD configuration for STM32F103 with ST-Link v2
# STM32F103 Blue Pill debugging configuration

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f1x.cfg]

# Adapter settings
adapter speed 1000

# Debug options
debug_level 0
set WORKAREASIZE 0x5000
set FLASH_SIZE 0x10000

# OpenOCD server port
telnet_port 4444
gdb_port 3333

